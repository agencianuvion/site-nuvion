name: Build and deploy

# Three ways this fires:
#  - push to main: code changes in this repo.
#  - repository_dispatch (type "wp-content-updated"): WordPress calls
#    GitHub's API to fire this whenever someone saves content — see
#    wordpress/auto-deploy.php.
#  - workflow_dispatch: manual "Run workflow" button, to force a rebuild.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wp-content-updated]
  workflow_dispatch: {}

# If a new run starts while one is still going, cancel the older one —
# only the latest content actually matters.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # This repo is a monorepo (frontend/ + wordpress/ + design-reference/),
    # not just the Astro project at its root — every npm/build step below
    # runs inside frontend/.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write production .env
        run: |
          echo "PUBLIC_WP_API_URL=${{ secrets.PUBLIC_WP_API_URL }}" >> .env
          # TODO: add any other PUBLIC_ env vars this project needs, e.g.:
          # echo "PUBLIC_STRIPE_MEMBERSHIP_LINK=${{ secrets.PUBLIC_STRIPE_MEMBERSHIP_LINK }}" >> .env

      - name: Install dependencies
        run: npm ci

      # Retries a few times before giving up. On the reference build, every
      # failure here traced back to Cloudflare momentarily blocking THAT
      # run's IP on the WP REST API fetch (bot-fighting against cloud/
      # datacenter IPs) — not a real outage, and a fresh IP on retry almost
      # always gets through cleanly.
      - name: Build (with retries)
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "Build attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 20s..."
              sleep 20
            fi
          done
          echo "All 3 build attempts failed."
          exit 1

      # --delete removes anything at the destination not in dist/ — needed
      # so removed pages actually get cleaned up on the server too.
      #
      # !!! IMPORTANT — READ BEFORE CHANGING DEPLOY_PATH !!!
      # --delete wipes ANY folder inside DEPLOY_PATH that isn't part of the
      # Astro build. Right now DEPLOY_PATH is
      # domains/agencianuvion.com.br/public_html/preview — an isolated
      # staging subfolder for a NEW subdomain (preview.agencianuvion.com.br),
      # so this is safe: it can never touch the live Elementor site at
      # public_html root or the headless WordPress at public_html/system.
      #
      # When cutting over to production (DEPLOY_PATH -> public_html root):
      #  1. Back up / remove the current Elementor site there first — this
      #     is a manual, deliberate step, not something to automate away.
      #  2. Add --exclude=system to the switches below — public_html/system
      #     is the headless WordPress backend; without this, --delete wipes
      #     it on the very next deploy. This exact mistake has already
      #     happened once on a past project; recovery took hours.
      #  3. Any other hand-managed folder ever placed inside DEPLOY_PATH
      #     needs its own --exclude=<folder>, same day it's added — not a
      #     one-time setup step, a standing rule.
      - name: Deploy over SSH (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: frontend/dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Lets a non-technical client find out a publish succeeded (or
      # didn't) from right inside wp-admin, without ever needing to look at
      # GitHub — see the sidebar indicator in wordpress/client-access.php.
      # `if: always()` runs this regardless of the outcome above;
      # `job.status` at this point already reflects that.
      - name: Report deploy status to WordPress
        if: always()
        run: |
          curl -s -X POST "https://system.agencianuvion.com.br/wp-json/site/v1/deploy-status" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_STATUS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"${{ job.status }}\"}" \
            --max-time 10 || true
